name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Replace Environment Variables
        run: |
          sed -i 's/GNtYY121XcZS2_Ki_/${{ secrets.EMAILJS_PUBLIC_KEY }}/g' index.html
          sed -i 's/service_0lbp3hd/${{ secrets.EMAILJS_SERVICE_ID }}/g' index.html
          sed -i 's/template_n2skp6d/${{ secrets.EMAILJS_TEMPLATE_ID }}/g' index.html
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
